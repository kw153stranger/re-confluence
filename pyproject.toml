[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconf"
version = "0.1.0"
description = "Confluence AI 재구성 — 업무 중심 IA로 재구성하는 배치 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reconf = "reconf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconf"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
